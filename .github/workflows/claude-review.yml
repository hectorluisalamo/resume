name: Claude PR Review

# Quality / correctness review on every PR, via Anthropic's first-party action.
# Auth: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) — free under Claude Max.
# Uses `pull_request` (NOT pull_request_target) — runs in the fork's restricted context.
# claude-code-action pinned >= v1.0.94 (CVSS-9.4 fix). NOTE: this action only begins
# reviewing once this file is merged to the default branch (anti-tampering validation).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write   # required by claude-code-action for the OIDC/OAuth auth flow

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1   # >= v1.0.94 (CVSS-9.4 fix)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request with a focus on:
            - Code quality and best practices
            - Potential bugs or issues
            - Security implications
            - Performance considerations

            Note: The PR branch is already checked out in the current working directory.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments — don't submit review text as messages.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
